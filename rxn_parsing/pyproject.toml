[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bonts"
version = "0.1.0"
description = "MinPop MBS bond orders from Gaussian output and n_TS decomposition"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
bonts-nts = "bonts.cli:main"

[tool.setuptools]
packages = ["bonts"]
